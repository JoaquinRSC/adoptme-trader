<!DOCTYPE html>
<html>
  <head>
    <!-- Title + description + Open Graph/Twitter are managed by the Quasar Meta
         plugin: a default set in MainLayout, overridden per page (per-pet, WFL).
         Keeping static copies here would duplicate every tag on those pages. -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png" />
    <link rel="icon" type="image/x-icon" href="icons/icon.ico" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- black-translucent: iOS paints NOTHING behind the status bar and lets the
         app show through — with "default" the bar is an opaque white strip no
         matter the theme. The topbar pads itself with env(safe-area-inset-top),
         so our own chrome colour fills that zone in both themes. The bar's TEXT
         follows the system theme; the app's default mode is auto for exactly
         that reason (they can only disagree if the user forces an override). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Browser/PWA chrome tint per scheme. The iOS standalone status bar can't
         be driven by an in-app toggle (it follows the SYSTEM theme), which is
         exactly why the app's default theme mode is "auto": both always agree. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f5f0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0b0c" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;500;600;700;800;900&display=swap" />
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
